name: NetlifyStatusBar
options:
  bundleIdPrefix: com.azwandi
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""

targets:
  NetlifyStatusBar:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: NetlifyStatusBar
        excludes:
          - "**/*.gitkeep"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.azwandi.NetlifyStatusBar
        PRODUCT_NAME: Netlify Status
        # Keep the Swift module name stable ("Netlify Status" would sanitize to
        # Netlify_Status and break `@testable import NetlifyStatusBar`).
        PRODUCT_MODULE_NAME: NetlifyStatusBar
        INFOPLIST_FILE: NetlifyStatusBar/Info.plist
        CODE_SIGN_ENTITLEMENTS: NetlifyStatusBar/NetlifyStatusBar.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  NetlifyStatusBarTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: NetlifyStatusBarTests
        excludes:
          - "**/*.gitkeep"
    dependencies:
      - target: NetlifyStatusBar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.azwandi.NetlifyStatusBarTests
        GENERATE_INFOPLIST_FILE: YES
        # App product is "Netlify Status.app" (PRODUCT_NAME override), so the
        # auto-derived TEST_HOST from the target name is wrong — point it at
        # the real product path.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Netlify Status.app/Contents/MacOS/Netlify Status"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  NetlifyStatusBar:
    build:
      targets:
        NetlifyStatusBar: all
        NetlifyStatusBarTests: [testing]
    test:
      targets:
        - NetlifyStatusBarTests
    run:
      config: Debug
    archive:
      config: Release
